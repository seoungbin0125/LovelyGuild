name: Collect Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # 매일 KST 00:10 실행 = UTC 15:10
    - cron: "10 15 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect MGF guild members
        env:
          GUILD_NAMES: LOVELY
          SERVER_ID: "4"
          TOBEOL_MAX_PAGE: "20"
          MEMBER_LIMIT: "120"
        run: npm run collect:all

      - name: Collect guild contents
        env:
          GUILD_CONTENT_NAMES: LOVELY
        run: npm run collect:contents

      - name: Collect gift card hotdeals
        env:
          HOTDEAL_KEYWORD: 기프트카드
          HOTDEAL_LIMIT: "5"
        run: npm run collect:hotdeals

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dashboard data"
          file_pattern: data/latest.json data/history.json data/guild-contents.json data/hotdeals.json
